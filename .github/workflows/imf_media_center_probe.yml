name: IMF Media Center Runner Probe

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/imf_media_center_probe.yml"
      - "scripts/probe_imf_media_center.py"
      - "config/discovery_sources.json"
      - "discovery/institutional_press.py"
      - "discovery/http.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/imf_media_center_probe.yml"
      - "scripts/probe_imf_media_center.py"

permissions:
  contents: read

concurrency:
  group: imf-media-center-runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe official IMF Media Center using the production collector
        run: python scripts/probe_imf_media_center.py
