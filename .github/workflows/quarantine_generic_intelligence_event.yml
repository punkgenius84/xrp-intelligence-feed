name: Quarantine One Malformed Intelligence Event

on:
  push:
    branches:
      - main
    paths:
      - "test/quarantine_generic_event.trigger"

permissions:
  contents: read

concurrency:
  group: xrp-intelligence-feed
  cancel-in-progress: false

jobs:
  quarantine-one-event:
    # Only the deliberate marker-add commit runs this job; marker deletion is inert.
    if: github.event.head_commit.message == 'Quarantine malformed generic-evidence event'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test and runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression suite before state mutation
        run: python -m pytest -q
      - name: Restore main-branch persistent state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          key: xrp-state-main-v1-restore
          restore-keys: |
            xrp-state-main-v1-
      - name: Restore intelligence quarantine audit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_quarantine.json
          key: xrp-intelligence-quarantine-main-v1-restore
          restore-keys: |
            xrp-intelligence-quarantine-main-v1-
      - name: Verify exact queue target and quarantine only if generic
        run: |
          python - <<'PY'
          from pathlib import Path
          from storage.intelligence_outbox import JsonIntelligenceOutboxState
          from intelligence.event_quality import has_only_generic_evidence_titles

          event_id = "evt-8005c54bfecb443fc363aa66"
          path = Path("state/intelligence_outbox.json")
          if not path.exists():
              raise SystemExit("Quarantine refused: main-branch outbox cache was not restored")
          matches = [item for item in JsonIntelligenceOutboxState(path).load()
                     if item.event.event_id == event_id]
          if len(matches) != 1:
              raise SystemExit(f"Quarantine refused: expected exactly one active target, found {len(matches)}")
          if not has_only_generic_evidence_titles(matches[0].event):
              raise SystemExit("Quarantine refused: target now has descriptive evidence")
          print(f"Preflight passed: exact_event_matches={len(matches)}")
          print(f"Evidence titles are generic only; safe to quarantine event {event_id}")
          PY
      - name: Quarantine exact malformed event (no publishing)
        run: python scripts/quarantine_generic_intelligence_event.py --event-id evt-8005c54bfecb443fc363aa66
      - name: Save updated main-branch persistent state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          key: xrp-state-main-v1-${{ hashFiles('state/seen.json', 'state/discovery.json', 'state/correlation.json', 'state/intelligence.json', 'state/intelligence_outbox.json', 'state/outbox.json', 'state/delivery_history.json') }}
      - name: Save intelligence quarantine audit
        if: success() && hashFiles('state/intelligence_quarantine.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_quarantine.json
          key: xrp-intelligence-quarantine-main-v1-${{ github.run_id }}-${{ hashFiles('state/intelligence_quarantine.json') }}
