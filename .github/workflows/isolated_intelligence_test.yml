name: Isolated Intelligence One-Event Test

on:
  push:
    branches:
      - main
    paths:
      - "test/isolated_intelligence_test.trigger"

permissions:
  contents: read

concurrency:
  group: xrp-intelligence-isolated-one-event-test
  cancel-in-progress: false

jobs:
  one-event-test:
    # Deleting the marker after the test must not start another publishing attempt.
    if: github.event.head_commit.message == 'Trigger isolated DriveWealth Ripple one-event intelligence test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test and runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression suite before any Discord delivery
        run: python -m pytest -q
      - name: Restore main-branch persistent state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          key: xrp-state-main-v1-restore
          restore-keys: |
            xrp-state-main-v1-
      - name: Restore intelligence delivery history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_delivery_history.json
          key: xrp-intelligence-delivery-history-main-v1-restore
          restore-keys: |
            xrp-intelligence-delivery-history-main-v1-
      - name: Restore intelligence quarantine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_quarantine.json
          key: xrp-intelligence-quarantine-main-v1-restore
          restore-keys: |
            xrp-intelligence-quarantine-main-v1-
      - name: Report selected event and safety settings
        run: |
          echo "Normal feed publishing is disabled by DISCORD_DRY_RUN=true."
          echo "Only the exact DriveWealth/Ripple event below may be delivered."
          echo "INTELLIGENCE_TEST_EVENT_ID=evt-a1945444a923128def03eacf"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("state/intelligence_outbox.json")
          if not p.exists():
              raise SystemExit("Test refused: main-branch intelligence outbox cache was not restored")
          data = json.loads(p.read_text(encoding="utf-8"))
          items = data.get("items", []) if isinstance(data, dict) else []
          target = [item for item in items if isinstance(item, dict) and
                    isinstance(item.get("event"), dict) and
                    item["event"].get("event_id") == "evt-a1945444a923128def03eacf"]
          if len(target) != 1:
              raise SystemExit(f"Test refused: expected exactly one queued target, found {len(target)}")
          event = target[0]["event"]
          evidence = event.get("evidence", [])
          print(f"Queue preflight passed: target_matches={len(target)} evidence_count={len(evidence)}")
          print(f"Target summary: {event.get('summary', '')}")
          PY
      - name: Run isolated one-event test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTELLIGENCE_DISCORD_WEBHOOK }}
          DISCORD_MAX_POSTS: "5"
          DISCORD_MAX_AGE_DAYS: "14"
          INTELLIGENCE_ENABLED: "false"
          INTELLIGENCE_PUBLISH: "false"
          INTELLIGENCE_TEST_ONLY: "true"
          INTELLIGENCE_TEST_EVENT_ID: "evt-a1945444a923128def03eacf"
          INTELLIGENCE_MIN_SCORE: "35"
          DISCORD_DRY_RUN: "true"
        run: python main.py
      - name: Save updated main-branch persistent state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          key: xrp-state-main-v1-${{ hashFiles('state/seen.json', 'state/discovery.json', 'state/correlation.json', 'state/intelligence.json', 'state/intelligence_outbox.json', 'state/outbox.json', 'state/delivery_history.json') }}
      - name: Save intelligence delivery history
        if: success() && hashFiles('state/intelligence_delivery_history.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_delivery_history.json
          key: xrp-intelligence-delivery-history-main-v1-${{ github.run_id }}-${{ hashFiles('state/intelligence_delivery_history.json') }}
      - name: Save intelligence quarantine
        if: success() && hashFiles('state/intelligence_quarantine.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_quarantine.json
          key: xrp-intelligence-quarantine-main-v1-${{ github.run_id }}-${{ hashFiles('state/intelligence_quarantine.json') }}
