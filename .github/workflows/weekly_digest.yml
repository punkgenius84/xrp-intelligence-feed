name: XRP Intelligence Weekly Digest

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xrp-intelligence-weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Restore persistent state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # The cache "version" is derived from this exact path list, so it must match the
          # list the main feed workflow saves with. A different list never hits those caches.
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          # Deliberately never an exact hit: the prefix picks the newest immutable state cache.
          key: xrp-state-${{ github.ref_name }}-v1-restore
          restore-keys: |
            xrp-state-${{ github.ref_name }}-v1-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python weekly_digest.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTELLIGENCE_DISCORD_WEBHOOK }}
