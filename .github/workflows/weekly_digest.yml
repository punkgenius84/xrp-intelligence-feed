name: XRP Intelligence Weekly Digest

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xrp-intelligence-weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Restore persistent state
        uses: actions/cache/restore@v5
        with:
          path: state/delivery_history.json
          key: xrp-state-${{ github.ref_name }}-v1-bootstrap
          restore-keys: |
            xrp-state-${{ github.ref_name }}-v1-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python weekly_digest.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTELLIGENCE_DISCORD_WEBHOOK }}
