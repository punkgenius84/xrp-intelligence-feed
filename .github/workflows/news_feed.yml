name: XRP Intelligence Feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print what would be posted to Discord, post nothing, save no state"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: xrp-intelligence-feed
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/outbox.json
          key: xrp-state-${{ github.ref_name }}-v1-bootstrap
          restore-keys: |
            xrp-state-${{ github.ref_name }}-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run feed
        run: python main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTELLIGENCE_DISCORD_WEBHOOK }}
          DISCORD_MAX_POSTS: "5"
          DISCORD_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      - name: Save persistent state
        if: success() && (github.event_name == 'schedule' || !inputs.dry_run)
        uses: actions/cache/save@v4
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
          key: xrp-state-${{ github.ref_name }}-v1-${{ hashFiles('state/seen.json', 'state/discovery.json', 'state/correlation.json') }}
