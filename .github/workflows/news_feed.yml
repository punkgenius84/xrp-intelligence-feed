name: XRP Intelligence Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: xrp-intelligence-feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore deduplication state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: xrp-seen-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xrp-seen-${{ github.ref_name }}-
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python main.py
      - name: Save deduplication state
        uses: actions/cache/save@v4
        with:
          path: state/seen.json
          key: xrp-seen-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
