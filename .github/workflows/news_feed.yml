name: XRP Intelligence Feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/news_feed.yml"
      - "config/discovery_sources.json"
      - "discovery/**"
      - "storage/**"
      - "intelligence/**"
      - "main.py"
      - "scripts/**"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print what would be posted to Discord, post nothing, save no state"
        type: boolean
        default: true
      preview_intelligence:
        description: "Preview queued intelligence summaries and evidence in logs (read-only; requires dry_run=true)"
        type: boolean
        default: false
      publish_intelligence_test:
        description: "Publish exactly one explicitly selected queued intelligence event; normal feed remains dry-run"
        type: boolean
        default: false
      intelligence_test_event_id:
        description: "Exact queued event ID for the isolated one-event test"
        type: string
        default: "evt-605fe5788f248b06e06fcb7f"

permissions:
  contents: read

concurrency:
  group: xrp-intelligence-feed
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # CI/test tooling lives in the development requirements file; runtime requirements stay lean.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Probe Coinbase official RSS (read-only diagnostic)
        if: github.event_name == 'push'
        run: python scripts/probe_coinbase_blog_rss.py
      - name: Probe Coinbase official dated index (read-only diagnostic)
        if: github.event_name == 'push'
        run: python scripts/probe_coinbase_landing_index.py
      - name: Probe Coinbase official product index (read-only diagnostic)
        if: github.event_name == 'push'
        run: python scripts/probe_coinbase_product_index.py
      - name: Probe Coinbase investor-news index (read-only diagnostic)
        if: github.event_name == 'push'
        run: python scripts/probe_coinbase_investor_news.py
      - name: Probe Swift official press indexes (read-only diagnostic)
        if: github.event_name == 'push'
        run: python scripts/probe_swift_press_index.py
      - name: Restore persistent state
        id: state_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          # Never use a permanent bootstrap key: it can mask newer state caches.
          # This intentionally misses exact-match restore so the prefix selects the
          # newest immutable state cache saved by a prior successful run.
          key: xrp-state-${{ github.ref_name }}-v1-restore
          restore-keys: |
            xrp-state-${{ github.ref_name }}-v1-
      - name: Restore intelligence delivery history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_delivery_history.json
          key: xrp-intelligence-delivery-history-${{ github.ref_name }}-v1-restore
          restore-keys: |
            xrp-intelligence-delivery-history-${{ github.ref_name }}-v1-
      - name: Restore intelligence quarantine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_quarantine.json
          key: xrp-intelligence-quarantine-${{ github.ref_name }}-v1-restore
          restore-keys: |
            xrp-intelligence-quarantine-${{ github.ref_name }}-v1-
      - name: Report restored state
        if: always()
        env:
          STATE_CACHE_HIT: ${{ steps.state_cache.outputs.cache-hit }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          print(f"Persistent state cache exact hit: {os.environ.get('STATE_CACHE_HIT', 'unknown')}")
          for name in (
              "state/seen.json",
              "state/discovery.json",
              "state/correlation.json",
              "state/intelligence.json",
              "state/intelligence_outbox.json",
              "state/intelligence_quarantine.json",
              "state/outbox.json",
              "state/delivery_history.json",
              "state/intelligence_delivery_history.json",
          ):
              path = Path(name)
              if not path.exists():
                  print(f"State: {name}: absent")
                  continue
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  if isinstance(value, dict) and isinstance(value.get("items"), list):
                      detail = f"schema={value.get('schema_version', 'unknown')} items={len(value['items'])}"
                  elif isinstance(value, dict):
                      detail = f"{len(value)} top-level entries"
                  elif isinstance(value, list):
                      detail = f"{len(value)} entries"
                  else:
                      detail = f"type={type(value).__name__}"
                  if name == "state/intelligence_outbox.json" and isinstance(value, dict):
                      queue_ages = []
                      latest_evidence_dates = []
                      missing_evidence_dates = 0
                      invalid_queue_dates = 0
                      now = datetime.now(timezone.utc)
                      for queued in value.get("items", []):
                          if not isinstance(queued, dict):
                              invalid_queue_dates += 1
                              continue
                          try:
                              queued_at = datetime.fromisoformat(str(queued["queued_at"]).replace("Z", "+00:00"))
                              if queued_at.tzinfo is None:
                                  queued_at = queued_at.replace(tzinfo=timezone.utc)
                              queue_ages.append(queued_at.astimezone(timezone.utc))
                          except (KeyError, TypeError, ValueError):
                              invalid_queue_dates += 1
                          event = queued.get("event", {})
                          evidence_dates = []
                          if isinstance(event, dict) and isinstance(event.get("evidence"), list):
                              for evidence in event["evidence"]:
                                  if not isinstance(evidence, dict):
                                      continue
                                  stamp = evidence.get("published_at")
                                  if not isinstance(stamp, str) or not stamp.strip():
                                      continue
                                  try:
                                      parsed = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                                      if parsed.tzinfo is None:
                                          parsed = parsed.replace(tzinfo=timezone.utc)
                                      evidence_dates.append(parsed.astimezone(timezone.utc))
                                  except ValueError:
                                      continue
                          if evidence_dates:
                              latest_evidence_dates.append(max(evidence_dates))
                          else:
                              missing_evidence_dates += 1
                      if queue_ages:
                          oldest_days = max(0, int((now - min(queue_ages)).total_seconds() // 86400))
                          newest_days = max(0, int((now - max(queue_ages)).total_seconds() // 86400))
                          old_evidence = sum(stamp < now - timedelta(days=30) for stamp in latest_evidence_dates)
                          detail += (
                              f" oldest_queued_days={oldest_days} newest_queued_days={newest_days}"
                              f" events_with_dates={len(latest_evidence_dates)}"
                              f" evidence_older_30d={old_evidence}"
                              f" events_missing_dates={missing_evidence_dates}"
                              f" invalid_queue_dates={invalid_queue_dates}"
                          )
                      # Log shape, counts, and age bands only, never event contents, titles, or URLs.
                  print(f"State: {name}: present ({detail})")
              except Exception as exc:
                  print(f"State: {name}: unreadable ({exc})")
          PY
      - name: Preview queued intelligence events (read-only)
        # Push runs are diagnostic dry runs: they never publish or save persistent state.
        # Preview there so queue review does not depend on remembering a manual checkbox.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preview_intelligence && inputs.dry_run)
        run: python scripts/preview_intelligence_outbox.py --limit 20

      - name: Restore intelligence model cache
        if: github.event_name != 'push'
        id: ollama_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ollama/models
          key: ollama-${{ runner.os }}-qwen2.5-3b-v1

      - name: Install Ollama
        if: github.event_name != 'push'
        # Pinned v0.40.3 release archive; verify the published SHA-256 before extraction.
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ollama-linux-amd64.tar.zst"
          curl --connect-timeout 15 --max-time 300 -fsSL \
            "https://github.com/ollama/ollama/releases/download/v0.40.3/ollama-linux-amd64.tar.zst" \
            -o "$archive"
          printf '%s  %s\n' \
            'ce6f8b671a699bf1ebafb28d60dbbabf4f37b30b499145fa308a8ba72de021d6' \
            "$archive" | sha256sum --check -
          sudo rm -rf /usr/local/lib/ollama
          sudo tar --zstd -xf "$archive" -C /usr/local
          ollama --version

      - name: Start Ollama
        if: github.event_name != 'push'
        env:
          OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
        run: |
          sudo systemctl stop ollama || true
          nohup env OLLAMA_MODELS="$OLLAMA_MODELS" ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Ensure intelligence model is available
        if: github.event_name != 'push'
        env:
          OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
        run: |
          if ollama list | awk 'NR > 1 {print $1}' | grep -Fxq 'qwen2.5:3b'; then
            echo "qwen2.5:3b already available from the restored model cache"
          else
            ollama pull qwen2.5:3b
          fi

      - name: Validate intelligence inference
        if: github.event_name != 'push'
        env:
          OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
          OLLAMA_ENDPOINT: "http://127.0.0.1:11434/api/chat"
          OLLAMA_MODEL: "qwen2.5:3b"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from intelligence.configuration import IntelligenceRuntimeConfig
          from intelligence.llm.ollama import OllamaProvider
          from intelligence.pipeline import enrich_clusters
          from models import NewsItem

          item = NewsItem(
              title="Federal Reserve announces a new framework for tokenized payment assets",
              url="https://example.com/shadow-test",
              source="Shadow test source",
              source_id="shadow-test",
              summary="The Federal Reserve announced a policy framework for tokenized payment assets and digital asset settlement.",
              published_at=datetime.now(timezone.utc),
              source_quality="primary",
              detected_entities=["Federal Reserve"],
              relevance_score=90,
              candidate_id="shadow-test-candidate",
          )
          config = IntelligenceRuntimeConfig(
              enabled=True,
              publish_enabled=False,
              model="qwen2.5:3b",
              max_items_per_run=1,
              min_relevance_score=50,
              timeout_seconds=90,
          )
          events, failures = enrich_clusters([item], OllamaProvider(model="qwen2.5:3b", timeout=90), config)
          if failures or len(events) != 1:
              raise SystemExit(f"intelligence inference smoke test failed: events={len(events)} failures={failures}")
          event = events[0]
          if not event.model or not event.summary or not event.significance or not event.claims:
              raise SystemExit("intelligence inference smoke test returned an incomplete event or no grounded claims")
          print(f"Intelligence inference smoke test passed: model={event.model!r} type={event.event_type!r} claims={len(event.claims)}")
          PY

      - name: Run feed
        id: feed
        run: python main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTELLIGENCE_DISCORD_WEBHOOK }}
          DISCORD_MAX_POSTS: "5"
          # Never post anything published more than this many days ago (0 disables).
          DISCORD_MAX_AGE_DAYS: "14"
          # Push-triggered runs are dry-run source diagnostics; the separate smoke test above validates inference.
          # Scheduled and manual runs keep full intelligence enrichment enabled.
          INTELLIGENCE_ENABLED: ${{ github.event_name != 'push' }}
          # Publishing is off except for an explicit manual one-event test.
          INTELLIGENCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_intelligence_test && inputs.dry_run && 'true' || 'false' }}
          INTELLIGENCE_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_intelligence_test && 'true' || 'false' }}
          INTELLIGENCE_TEST_EVENT_ID: ${{ inputs.intelligence_test_event_id }}
          INTELLIGENCE_MIN_SCORE: "35"
          OLLAMA_ENDPOINT: "http://127.0.0.1:11434/api/chat"
          OLLAMA_MODEL: "qwen2.5:3b"
          DISCORD_DRY_RUN: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.dry_run) }}
      - name: Save intelligence model cache
        if: github.event_name != 'push' && success() && steps.ollama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ollama/models
          key: ollama-${{ runner.os }}-qwen2.5-3b-v1

      - name: Save persistent state
        if: steps.feed.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!inputs.dry_run || inputs.publish_intelligence_test)))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/seen.json
            state/discovery.json
            state/correlation.json
            state/intelligence.json
            state/intelligence_outbox.json
            state/outbox.json
            state/delivery_history.json
          key: xrp-state-${{ github.ref_name }}-v1-${{ hashFiles('state/seen.json', 'state/discovery.json', 'state/correlation.json', 'state/intelligence.json', 'state/intelligence_outbox.json', 'state/outbox.json', 'state/delivery_history.json') }}
      - name: Check intelligence delivery history
        id: intelligence_delivery_history
        if: steps.feed.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!inputs.dry_run || inputs.publish_intelligence_test)))
        run: |
          if [ -f state/intelligence_delivery_history.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save intelligence delivery history
        if: steps.intelligence_delivery_history.outputs.present == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_delivery_history.json
          key: xrp-intelligence-delivery-history-${{ github.ref_name }}-v1-${{ github.run_id }}-${{ hashFiles('state/intelligence_delivery_history.json') }}
      - name: Check intelligence quarantine
        id: intelligence_quarantine
        if: steps.feed.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!inputs.dry_run || inputs.publish_intelligence_test)))
        run: |
          if [ -f state/intelligence_quarantine.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save intelligence quarantine
        if: steps.intelligence_quarantine.outputs.present == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/intelligence_quarantine.json
          key: xrp-intelligence-quarantine-${{ github.ref_name }}-v1-${{ github.run_id }}-${{ hashFiles('state/intelligence_quarantine.json') }}
