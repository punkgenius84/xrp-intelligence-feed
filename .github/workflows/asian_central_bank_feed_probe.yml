name: Google News and Official Publisher Probe

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/asian_central_bank_feed_probe.yml"
      - "scripts/probe_asian_central_bank_feeds.py"
      - "tests/test_asian_central_bank_feed_probe.py"
      - "config/discovery_sources.json"
      - "config/entities.json"
      - "config/keywords.json"
      - "config/thresholds.json"
      - "discovery/dispatch.py"
      - "discovery/google_news_official_rss.py"
      - "discovery/http.py"
      - "intelligence/entities.py"
      - "intelligence/relevance.py"
      - "intelligence/source_quality.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/asian_central_bank_feed_probe.yml"
      - "scripts/probe_asian_central_bank_feeds.py"
      - "tests/test_asian_central_bank_feed_probe.py"
      - "config/discovery_sources.json"
      - "config/entities.json"
      - "config/keywords.json"
      - "config/thresholds.json"
      - "discovery/dispatch.py"
      - "discovery/google_news_official_rss.py"
      - "discovery/http.py"
      - "intelligence/entities.py"
      - "intelligence/relevance.py"
      - "intelligence/source_quality.py"

permissions:
  contents: read

concurrency:
  group: google-news-official-publisher-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe official feed discovery endpoints (read-only)
        run: python scripts/probe_asian_central_bank_feeds.py
